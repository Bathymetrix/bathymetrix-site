  <style>
    body { font-family: "Avenir Next", Avenir, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .vcard-page {
      position: relative;
      display: grid;
      place-items: center;
      min-height: min(740px, calc(100vh - 78px));
      padding: 4rem 1.25rem;
      overflow: hidden;
      background: linear-gradient(145deg, #f8fbff 0%, #fff 48%, #f3f7fc 100%);
    }
    .vcard-page::before {
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at 50% 110%, rgba(45, 134, 202, .10), transparent 55%);
      content: "";
      pointer-events: none;
    }
    .vcard-card {
      position: relative;
      width: min(100%, 510px);
      padding: clamp(2rem, 6vw, 3.5rem);
      border: 1px solid rgba(219, 228, 238, .9);
      border-radius: 24px;
      background: rgba(255, 255, 255, .92);
      box-shadow: 0 28px 80px rgba(15, 45, 75, .11);
      text-align: center;
    }
    .vcard-logo { width: min(285px, 82%); height: auto; margin: 0 auto 2rem; }
    .vcard-name {
      margin: 0;
      color: #10233e;
      font-size: clamp(1.9rem, 7vw, 2.55rem);
      line-height: 1.12;
      letter-spacing: -.03em;
    }
    .vcard-degree { font-size: .72em; letter-spacing: -.02em; white-space: nowrap; }
    .vcard-title { margin: .65rem 0 0; color: #315476; font-weight: 500; }
    .vcard-org { margin: .1rem 0 0; color: #536b82; }
    .vcard-wave { width: min(310px, 100%); height: auto; margin: 1.5rem auto 1.3rem; }
    .vcard-details { display: grid; gap: .45rem; color: #284663; font-size: .98rem; }
    .vcard-details a { text-underline-offset: 3px; }
    .vcard-details a:hover { color: #0878bd; text-decoration: underline; }
    .vcard-location { margin-top: .35rem; color: #64788d; font-size: .9rem; }
    .vcard-actions { display: flex; justify-content: center; margin-top: 2rem; }
    .vcard-actions .button { min-height: 50px; padding-inline: 1.5rem; }
    .vcard-note { margin: 1rem 0 0; color: #6b7e90; font-size: .82rem; }
    @media (max-width: 520px) {
      .vcard-page { min-height: calc(100vh - 68px); padding: 2rem 1rem; }
      .vcard-card { border-radius: 20px; }
      .vcard-logo { margin-bottom: 1.6rem; }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="/" aria-label="Bathymetrix home">
        <img class="brand-mark" src="/assets/bathymetrix-wordmark.png" alt="Bathymetrix®">
      </a>
      <nav class="site-nav" aria-label="Main navigation">
        <ul><li><a href="/">Bathymetrix.com</a></li></ul>
      </nav>
    </div>
  </header>
  <main class="vcard-page">
    <article class="vcard-card" aria-labelledby="contact-name">
      <img class="vcard-logo" src="/assets/bathymetrix-logo-full.svg" alt="Bathymetrix® wordmark and waveform">
      <h1 class="vcard-name" id="contact-name">Joel D. Simon<span class="vcard-degree">, Ph.D.</span></h1>
      <p class="vcard-title">Founder &amp; Chief Scientist</p>
      <p class="vcard-org">Bathymetrix, LLC</p>
      <div class="vcard-details">
        <a href="tel:+15038108670">+1 (503) 810-8670</a>
        <a href="mailto:jdsimon@bathymetrix.com">jdsimon@bathymetrix.com</a>
        <a href="https://bathymetrix.com">bathymetrix.com</a>
      </div>
      <p class="vcard-location">Portland, OR, USA</p>
      <div class="vcard-actions">
        <a class="button button-primary" href="/vcard/joel-simon.vcf" download="Joel-Simon.vcf">Save contact</a>
      </div>
      <p class="vcard-note">Downloads a contact card for your address book.</p>
    </article>
  </main>
</body>
</html>
