  <script>
    (() => {
      const svg = document.querySelector('svg');
      const lines = [...svg.querySelectorAll('#baseLines path')];
      const gradient = svg.querySelector('#loopShimmer');
      const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (reducedMotion) return;

      const lengths = lines.map((path) => path.getTotalLength());
      const drawMs = 3000;
      const buildStaggerMs = 340;
      const eraseMs = 2600;
      const eraseStaggerMs = 260;
      const pause = (ms) => new Promise((resolve) => window.setTimeout(resolve, ms));
      const frame = () => new Promise((resolve) => requestAnimationFrame(() => resolve()));

      lines.forEach((path, index) => {
        path.style.strokeDasharray = `${lengths[index]} ${lengths[index]}`;
        path.style.strokeDashoffset = String(lengths[index]);
        path.style.transition = `stroke-dashoffset ${drawMs}ms cubic-bezier(.35, 0, .2, 1)`;
      });

      async function drawAll() {
        lines.forEach((path) => { path.style.transition = `stroke-dashoffset ${drawMs}ms cubic-bezier(.35, 0, .2, 1)`; });
        await frame();
        await Promise.all(lines.map((path, index) => new Promise((resolve) => {
          window.setTimeout(() => {
            path.style.strokeDashoffset = '0';
            window.setTimeout(resolve, drawMs + 50);
          }, index * buildStaggerMs);
        })));
      }

      async function shimmerOnce() {
        const duration = 4400;
        const start = performance.now();
        await new Promise((resolve) => {
          function step(now) {
            const progress = Math.min(1, (now - start) / duration);
            const x = -1700 + 3400 * progress;
            gradient.setAttribute('gradientTransform', `translate(${x} 0)`);
            if (progress < 1) requestAnimationFrame(step);
            else resolve();
          }
          requestAnimationFrame(step);
        });
        gradient.setAttribute('gradientTransform', 'translate(-1700 0)');
      }

      async function eraseAll() {
        lines.forEach((path) => { path.style.transition = `stroke-dashoffset ${eraseMs}ms cubic-bezier(.4, 0, .8, 1)`; });
        await frame();
        await Promise.all([...lines].reverse().map((path, reverseIndex) => new Promise((resolve) => {
          const index = lines.indexOf(path);
          window.setTimeout(() => {
            path.style.strokeDashoffset = String(-lengths[index]);
            window.setTimeout(resolve, eraseMs + 50);
          }, reverseIndex * eraseStaggerMs);
        })));
      }

      async function loop() {
        while (true) {
          lines.forEach((path, index) => {
            path.style.transition = 'none';
            path.style.strokeDashoffset = String(lengths[index]);
          });
          gradient.setAttribute('gradientTransform', 'translate(-1700 0)');
          // Let the hidden reset reach a rendered frame before transitions restart.
          await frame();
          await frame();
          await drawAll();
          await pause(250);
          await shimmerOnce();
          await pause(700);
          await eraseAll();
          await pause(500);
        }
      }
      loop();
    })();
  </script>
</body>
